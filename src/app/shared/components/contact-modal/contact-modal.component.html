<div class="modal-backdrop" (click)="close()">
  <div class="modal" (click)="$event.stopPropagation()">
    <button type="button" class="modal-close" [attr.aria-label]="'contactModal.close' | translate" (click)="close()">
      <svg class="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18" /><line x1="18" y1="6" x2="6" y2="18" /></svg>
    </button>
    <h2>{{ title }}</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        {{ 'contactModal.name' | translate }}
        <input type="text" formControlName="name" maxlength="200" />
        <app-form-error [control]="form.controls.name" />
      </label>
      <label>
        {{ 'contactModal.phone' | translate }}
        <input type="tel" inputmode="numeric" formControlName="phone" appPhoneInput maxlength="12" />
        <app-form-error [control]="form.controls.phone" />
      </label>
      <label>
        {{ 'contactModal.email' | translate }}
        <input type="email" formControlName="email" maxlength="320" />
        <app-form-error [control]="form.controls.email" />
      </label>
      <label>
        {{ 'contactModal.message' | translate }}
        <textarea rows="4" formControlName="message" maxlength="5000"></textarea>
        <app-form-error [control]="form.controls.message" />
      </label>

      @if (showQualifyingQuestions) {
        <label>
          {{ 'contactModal.fundingMethod' | translate }}
          <select formControlName="fundingMethod">
            <option value="">{{ 'contactModal.preferNotToSay' | translate }}</option>
            <option value="cash">{{ 'contactModal.fundingCash' | translate }}</option>
            <option value="bankLoan">{{ 'contactModal.fundingBankLoan' | translate }}</option>
            <option value="infonavitFovissste">{{ 'contactModal.fundingInfonavitFovissste' | translate }}</option>
            <option value="notSure">{{ 'contactModal.fundingNotSure' | translate }}</option>
          </select>
        </label>
        <label>
          {{ 'contactModal.timeline' | translate }}
          <select formControlName="timeline">
            <option value="">{{ 'contactModal.preferNotToSay' | translate }}</option>
            <option value="readyNow">{{ 'contactModal.timelineReadyNow' | translate }}</option>
            <option value="oneToThreeMonths">{{ 'contactModal.timelineOneToThreeMonths' | translate }}</option>
            <option value="threeToSixMonths">{{ 'contactModal.timelineThreeToSixMonths' | translate }}</option>
            <option value="justBrowsing">{{ 'contactModal.timelineJustBrowsing' | translate }}</option>
          </select>
        </label>
        <label>
          {{ 'contactModal.hasAgent' | translate }}
          <select formControlName="hasAgent">
            <option value="">{{ 'contactModal.preferNotToSay' | translate }}</option>
            <option value="yes">{{ 'contactModal.yes' | translate }}</option>
            <option value="no">{{ 'contactModal.no' | translate }}</option>
          </select>
        </label>
      }

      <button type="submit" class="primary" [disabled]="sending">
        {{ 'contactModal.send' | translate }}
      </button>
    </form>
  </div>
</div>
