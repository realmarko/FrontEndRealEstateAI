<div class="page">
  <h1>{{ 'favorites.title' | translate }}</h1>

  @if (favoriteListings().length) {
    <div class="grid">
      @for (listing of favoriteListings(); track listing.id) {
        <app-listing-card
          [listing]="listing"
          [isFavorite]="true"
          (toggleFavorite)="toggleFavorite($event)"
        />
      }
    </div>
  } @else {
    <p class="empty">
      {{ 'favorites.emptyPrefix' | translate }}
      <a routerLink="/listings">{{ 'favorites.browseLink' | translate }}</a>.
    </p>
  }
</div>
