<div class="page">
  <h1>{{ 'favorites.title' | translate }}</h1>

  @if (favorites.favoriteListings().length) {
    <app-listing-grid [listings]="favorites.favoriteListings()" />
  } @else {
    <p class="empty">
      {{ 'favorites.emptyPrefix' | translate }}
      <a routerLink="/listings">{{ 'favorites.browseLink' | translate }}</a>.
    </p>
  }
</div>
