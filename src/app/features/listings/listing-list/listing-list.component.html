<div class="page">
  <div class="header">
    <h1>{{ 'listings.title' | translate }}</h1>
    @if (auth.isAuthenticated()) {
      <a class="primary-link" routerLink="/listings/new">{{ 'listings.addListing' | translate }}</a>
    }
  </div>

  <div class="filters">
    <input
      type="search"
      [placeholder]="'listings.searchPlaceholder' | translate"
      [value]="search()"
      (input)="onSearchChange($any($event.target).value)"
    />

    <div class="type-toggle">
      <button
        type="button"
        [class.active]="typeFilter() === 'all'"
        (click)="setTypeFilter('all')"
      >
        {{ 'listings.filterAll' | translate }}
      </button>
      <button
        type="button"
        [class.active]="typeFilter() === 'rent'"
        (click)="setTypeFilter('rent')"
      >
        {{ 'listings.filterRent' | translate }}
      </button>
      <button
        type="button"
        [class.active]="typeFilter() === 'sale'"
        (click)="setTypeFilter('sale')"
      >
        {{ 'listings.filterSale' | translate }}
      </button>
    </div>

    <input
      type="text"
      list="listing-company-options"
      [placeholder]="'listings.companyPlaceholder' | translate"
      [value]="companyFilter()"
      (input)="setCompanyFilter($any($event.target).value)"
    />
    <datalist id="listing-company-options">
      @for (name of brokerages(); track name) {
        <option [value]="name"></option>
      }
    </datalist>

    @if (auth.isAuthenticated()) {
      <button type="button" (click)="toggleSaveSearchForm()">{{ 'savedSearches.saveButton' | translate }}</button>
      @if (showSaveSearchForm()) {
        <div class="save-search-form">
          <input
            type="text"
            [placeholder]="'savedSearches.namePlaceholder' | translate"
            [value]="saveSearchName()"
            (input)="setSaveSearchName($any($event.target).value)"
            (keyup.enter)="saveCurrentSearch()"
          />
          <button type="button" (click)="saveCurrentSearch()">{{ 'savedSearches.confirm' | translate }}</button>
        </div>
      }
    }
  </div>

  @if (listings().length) {
    <app-listing-grid [listings]="listings()" />
  } @else {
    <p class="empty">{{ 'listings.empty' | translate }}</p>
  }
</div>
