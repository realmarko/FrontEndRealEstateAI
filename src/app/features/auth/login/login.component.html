<div class="auth-card">
  <h1>{{ 'login.title' | translate }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      {{ 'login.email' | translate }}
      <input type="email" formControlName="email" autocomplete="email" />
      <app-form-error [control]="form.controls.email" />
    </label>

    <label>
      {{ 'login.password' | translate }}
      <input type="password" formControlName="password" autocomplete="current-password" />
      <app-form-error [control]="form.controls.password" />
    </label>

    <button type="submit">{{ 'login.submit' | translate }}</button>
  </form>

  <div class="auth-divider"><span>{{ 'login.orDivider' | translate }}</span></div>
  <div class="social-buttons">
    <div #googleButton class="google-button"></div>
    <button type="button" class="facebook-button" (click)="onFacebookClick()">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07c0 6.02 4.39 11.01 10.13 11.93v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.95h-1.51c-1.49 0-1.95.93-1.95 1.89v2.27h3.32l-.53 3.49h-2.79V24C19.61 23.08 24 18.09 24 12.07z"/>
      </svg>
      {{ 'login.continueWithFacebook' | translate }}
    </button>
  </div>

  <p class="switch"><a routerLink="/forgot-password">{{ 'login.forgotPassword' | translate }}</a></p>
  <p class="switch">{{ 'login.noAccount' | translate }} <a routerLink="/register">{{ 'login.registerLink' | translate }}</a></p>
</div>
