<div class="auth-card">
  <h1>{{ 'register.title' | translate }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      {{ 'register.name' | translate }}
      <input type="text" formControlName="name" autocomplete="name" />
    </label>

    <label>
      {{ 'register.email' | translate }}
      <input type="email" formControlName="email" autocomplete="email" />
    </label>

    <label>
      {{ 'register.password' | translate }}
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit">{{ 'register.submit' | translate }}</button>
  </form>

  <p class="switch">{{ 'register.haveAccount' | translate }} <a routerLink="/login">{{ 'register.loginLink' | translate }}</a></p>
</div>
