<div class="auth-card">
  <h1>{{ 'agentSignup.title' | translate }}</h1>
  <p class="subtitle">{{ 'agentSignup.subtitle' | translate }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      {{ 'register.firstName' | translate }} / {{ 'register.lastName' | translate }}
      <input type="text" [value]="auth.currentUser()?.firstName + ' ' + auth.currentUser()?.lastName" disabled />
    </label>

    <label>
      {{ 'register.email' | translate }}
      <input type="email" [value]="auth.currentUser()?.email" disabled />
    </label>

    <label>
      {{ 'agentSignup.phone' | translate }}
      <input type="tel" formControlName="phone" autocomplete="tel" />
    </label>

    <label>
      {{ 'agentSignup.company' | translate }}
      <input type="text" formControlName="company" list="brokerage-options" autocomplete="off" [placeholder]="'agentSignup.companyPlaceholder' | translate" />
      <datalist id="brokerage-options">
        @for (name of brokerages(); track name) {
          <option [value]="name"></option>
        }
      </datalist>
    </label>

    <label class="checkbox-label">
      <input type="checkbox" formControlName="isIndependent" />
      {{ 'agentSignup.independent' | translate }}
    </label>

    <label>
      {{ 'agentSignup.bio' | translate }}
      <textarea rows="4" formControlName="bio" [placeholder]="'agentSignup.bioPlaceholder' | translate"></textarea>
    </label>

    <label>
      {{ 'agentSignup.specialties' | translate }}
      <input type="text" formControlName="specialties" [placeholder]="'agentSignup.specialtiesPlaceholder' | translate" />
    </label>

    <label>
      {{ 'agentSignup.photo' | translate }}
      <input type="file" accept="image/jpeg,image/png,image/webp" (change)="onPhotoSelected($event)" />
    </label>

    @if (photoPreview()) {
      <img class="photo-preview" [src]="photoPreview()" [alt]="'agentSignup.photo' | translate" />
    }
    @if (photoError()) {
      <p class="error">{{ photoError() }}</p>
    }

    <button type="submit" [disabled]="submitting()">{{ 'agentSignup.submit' | translate }}</button>
  </form>
</div>
