<a class="card" [routerLink]="['/agents', agent.id]">
  <div class="photo">
    @if (agent.photoUrl) {
      <img [src]="agent.photoUrl" [alt]="agent.name" />
    } @else {
      <div class="avatar">{{ initials }}</div>
    }
  </div>

  <div class="body">
    <h3>{{ agent.name }}</h3>
    @if (agent.company) {
      <p class="company">{{ agent.company }}</p>
    }

    <p class="stat">
      <strong>{{ agent.propertiesCount }}</strong> {{ 'agents.propertiesCount' | translate }}
    </p>
    <p class="contact">{{ agent.email }}</p>
    <p class="contact">{{ agent.phone }}</p>
  </div>
</a>
