name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ubuntu-latest ships Chrome preinstalled, but karma-chrome-launcher's auto-detection
      # doesn't reliably find it there — confirmed by reproducing this exact job (root, Node 22,
      # ChromeHeadlessNoSandbox) in a container: it fails with "No binary for ChromeHeadless
      # browser on your platform" until CHROME_BIN is set explicitly. Resolved dynamically here
      # rather than hardcoding a path, since the runner image's exact binary name/location isn't
      # guaranteed to stay the same across GitHub's image updates.
      - name: Find Chrome
        run: echo "CHROME_BIN=$(which google-chrome || which chromium-browser || which chromium)" >> "$GITHUB_ENV"

      # ChromeHeadlessNoSandbox is a launcher the Angular CLI's karma builder already defines
      # (--no-sandbox --disable-gpu --disable-dev-shm-usage) for exactly this case — see
      # getBuiltInKarmaConfig in @angular/build's karma builder. Plain ChromeHeadless fails
      # immediately here because the runner executes as root and Chrome refuses to launch its
      # sandbox as root.
      - name: Test
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadlessNoSandbox

      - name: Build
        run: npx ng build
