name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ubuntu-latest ships Chrome preinstalled, so ChromeHeadless (from karma-chrome-launcher,
      # already a devDependency) runs with no extra setup — no Xvfb or browser install needed.
      - name: Test
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadless

      - name: Build
        run: npx ng build
