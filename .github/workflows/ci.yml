name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # env-keys.ts holds the real Google Maps API key and is gitignored on purpose (see
      # env-keys.example.ts) — it never exists on a clean checkout, so environment.ts's import
      # fails to resolve without this. A placeholder key is fine for build/test: nothing in the
      # test suite or the build itself actually calls the Maps API.
      - name: Add placeholder Google Maps key
        run: cp src/environments/env-keys.example.ts src/environments/env-keys.ts

      # karma-chrome-launcher's auto-detection doesn't reliably find ubuntu-latest's preinstalled
      # Chrome, and guessing at its binary name/path directly (google-chrome vs
      # google-chrome-stable, etc.) proved fragile across runner image variations. This action
      # installs a known Chrome build and reports its exact path instead of relying on whatever
      # happens to already be on the runner.
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Set CHROME_BIN
        run: echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      # ChromeHeadlessNoSandbox is a launcher the Angular CLI's karma builder already defines
      # (--no-sandbox --disable-gpu --disable-dev-shm-usage) for exactly this case — see
      # getBuiltInKarmaConfig in @angular/build's karma builder. Plain ChromeHeadless fails
      # immediately here because the runner executes as root and Chrome refuses to launch its
      # sandbox as root.
      - name: Test
        # --reporters=progress drops Karma's default Jasmine HTML reporter — in this headless CI
        # browser it reliably throws post-suite ("Cannot read properties of null (reading
        # 'appendChild')", HtmlReporter.jasmineDone trying to write to a DOM node that's gone by
        # the time it runs) and fails the job even though every spec above it already passed.
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadlessNoSandbox --reporters=progress

      - name: Build
        run: npx ng build
