name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ubuntu-latest ships Chrome preinstalled, so no Xvfb or browser install is needed — but
      # plain ChromeHeadless fails immediately there because the runner executes as root and
      # Chrome refuses to launch its sandbox as root. ChromeHeadlessNoSandbox is a launcher the
      # Angular CLI's karma builder already defines (--no-sandbox --disable-gpu
      # --disable-dev-shm-usage) for exactly this case — see getBuiltInKarmaConfig in
      # @angular/build's karma builder.
      - name: Test
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadlessNoSandbox

      - name: Build
        run: npx ng build
