name: Deploy frontend to prod

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  S3_BUCKET: realestateapp-frontend-prod
  CLOUDFRONT_DISTRIBUTION_ID: E24P5VX8CULI3A

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Add placeholder Google Maps key
        run: cp src/environments/env-keys.example.ts src/environments/env-keys.ts

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Set CHROME_BIN
        run: echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Test
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadlessNoSandbox

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # env-keys.ts is gitignored (holds the real Google Maps key + OAuth Client ID) — write both
      # real values from repo secrets so the deployed build actually works, unlike the test job's
      # placeholder copy which is fine for build/test only. Same GOOGLE_CLIENT_ID secret as
      # deploy-dev.yml — one Google Cloud OAuth Client ID covers every environment (it's keyed by
      # authorized origin, not by secret value).
      - name: Write Google keys
        run: |
          echo "export const GOOGLE_MAPS_API_KEY = '${{ secrets.GOOGLE_MAPS_API_KEY }}';" > src/environments/env-keys.ts
          echo "export const GOOGLE_CLIENT_ID = '${{ secrets.GOOGLE_CLIENT_ID }}';" >> src/environments/env-keys.ts

      - name: Build (prod-deploy config)
        run: npx ng build --configuration=production,prod-deploy

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Split in two passes so hashed JS/CSS bundles (content-addressed by the Angular build —
      # a change always gets a new filename) can be cached by the browser/CDN indefinitely,
      # while index.html and any non-hashed file (favicon, future static assets) must always be
      # revalidated — otherwise a stale index.html could keep pointing at bundle filenames that
      # no longer exist after the next deploy. --exclude/--include with --delete also excludes
      # the matching keys from deletion in that pass, so running both passes together is
      # equivalent to one full sync, just with different Cache-Control per file type.
      - name: Sync hashed JS/CSS to S3 (cache forever)
        run: |
          aws s3 sync dist/realestateapp-frontend/browser "s3://${S3_BUCKET}" --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" --include "*.js" --include "*.css"

      - name: Sync index.html and other static files to S3 (always revalidate)
        run: |
          aws s3 sync dist/realestateapp-frontend/browser "s3://${S3_BUCKET}" --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*.js" --exclude "*.css"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*'
